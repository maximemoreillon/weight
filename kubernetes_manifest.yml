---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weight-env
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: weight-env-from-vault
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: weight
  data:
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: mqtt
        property: USERNAME
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: mqtt
        property: PASSWORD
