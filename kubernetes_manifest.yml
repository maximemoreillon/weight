apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          env:
            - name: MQTT_URL
              value: mqtt://mqtt.mqtt
            - name: MQTT_TOPIC
              value: moreillon/scale-f79c9/measurement
            - name: DB_DATABASE
              value: health
            - name: DB_HOST
              value: postgres.postgreesql
          envFrom:
            - secretRef:
                name: weight-env-from-vault
          resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
spec:
  type: ClusterIP
  # type: NodePort
  selector:
    app: ${APPLICATION_NAME}
  ports:
    - port: 80
